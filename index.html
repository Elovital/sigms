<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:8000">
  <title>SIGMS ELOVITAL — A abrir...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    img { height: 80px; margin-bottom: 24px; }
    h1 { font-size: 20px; color: #1e293b; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
      margin: 4px;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-outline {
      background: transparent;
      color: #2563eb;
      border: 2px solid #2563eb;
    }
    .btn-outline:hover { background: #eff6ff; }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="static/img/logo.png" alt="ELOVITAL" onerror="this.style.display='none'">
    <h1>Sistema de Gestão SIGMS</h1>
    <p>A redirecionar automaticamente para o sistema...</p>
    <a href="http://localhost:8000" class="btn">Abrir Sistema Local</a>
    <a href="https://elovital-ao.com" class="btn btn-outline" target="_blank">Abrir Online</a>
    <div class="status">
      <span class="dot"></span>Servidor local na porta 8000
    </div>
  </div>

  <script>
    // Verifica se o servidor está disponível
    fetch('http://localhost:8000/health')
      .then(r => r.json())
      .then(() => {
        setTimeout(() => { window.location.href = 'http://localhost:8000'; }, 1500);
      })
      .catch(() => {
        document.querySelector('p').textContent = 'Servidor local não está a correr. Clique em "Abrir Online" para aceder.';
        document.querySelector('.dot').style.background = '#ef4444';
        document.querySelector('.status').innerHTML = '<span class="dot" style="background:#ef4444;animation:none"></span>Servidor offline';
      });
  </script>
</body>
</html>
