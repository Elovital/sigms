# ══════════════════════════════════════════════════════════════════════════════
# SIGMS ELOVITAL — Configuração Fly.io
# Deploy: fly deploy
# Logs:   fly logs
# Shell:  fly ssh console
# ══════════════════════════════════════════════════════════════════════════════

app       = "sigms-elovital"
primary_region = "jnb"          # Joanesburgo — mais próximo de Angola

[build]
  dockerfile = "Dockerfile"

# ── HTTP service ──────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 8000
  force_https         = true         # HTTP → redireccionado para HTTPS
  auto_stop_machines  = false        # NUNCA dorme (free tier permite 1 máquina sempre on)
  min_machines_running = 1           # Sempre 1 instância disponível
  processes           = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

# Healthcheck — Fly.io verifica /health antes de considerar o deploy bem-sucedido
[[http_service.checks]]
  grace_period = "30s"
  interval     = "30s"
  method       = "GET"
  path         = "/health"
  timeout      = "10s"

# ── VM ────────────────────────────────────────────────────────────────────────
[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"    # Free tier: até 3 VMs de 256 MB grátis por mês

# ── Volume persistente ────────────────────────────────────────────────────────
# Guarda ficheiros da app entre deploys (backups, logs).
# A base de dados fica no Neon (PostgreSQL externo) — mais fiável.
[[mounts]]
  source      = "sigms_data"
  destination = "/app/data"
  initial_size = "1gb"
